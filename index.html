<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Punto Prisma - Alquileres</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased flex justify-center items-center min-h-screen">

    <!-- Contenedor Estilo Celular -->
    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[850px] sm:max-h-[90vh] sm:rounded-3xl sm:shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
        
        <!-- Header -->
        <header class="bg-brand-600 text-white px-5 py-4 flex justify-between items-center shadow-md z-10">
            <div>
                <h1 class="font-bold text-lg tracking-wide"><i class="fa-solid fa-house-chimney-user mr-2"></i>Punto Prisma Alquileres</h1>
                <p class="text-xs text-brand-100">Gestión Inteligente Local</p>
            </div>
            <button onclick="abrirModalNuevo()" class="bg-white text-brand-700 font-semibold text-xs px-3 py-2 rounded-xl shadow hover:bg-brand-50 transition active:scale-95 flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> Nuevo
            </button>
        </header>

        <!-- Barra de Navegación / Filtros Rábidos -->
        <div class="bg-slate-50 px-4 py-2 border-b border-slate-200 flex gap-2 text-xs font-medium">
            <button onclick="filtrarEstado('todos')" id="btn-filtro-todos" class="flex-1 py-1.5 rounded-lg bg-brand-600 text-white transition shadow-sm">Todos</button>
            <button onclick="filtrarEstado('ocupado')" id="btn-filtro-ocupado" class="flex-1 py-1.5 rounded-lg bg-white text-slate-600 border border-slate-200 transition">Ocupados</button>
            <button onclick="filtrarEstado('disponible')" id="btn-filtro-disponible" class="flex-1 py-1.5 rounded-lg bg-white text-slate-600 border border-slate-200 transition">Disponibles</button>
        </div>

        <!-- Contenido Principal Dinámico -->
        <main id="lista-inmuebles" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
            <!-- Se inyecta por JS -->
        </main>

        <!-- Navbar inferior móvil -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-3 px-6 flex justify-around items-center text-xs text-slate-500 shadow-lg">
            <button onclick="filtrarEstado('todos')" class="flex flex-col items-center text-brand-600 font-bold">
                <i class="fa-solid fa-list text-lg"></i>
                <span>Panel</span>
            </button>
            <button onclick="abrirModalNuevo()" class="flex flex-col items-center hover:text-brand-600">
                <i class="fa-solid fa-circle-plus text-lg"></i>
                <span>Agregar</span>
            </button>
            <button onclick="exportarBackup()" class="flex flex-col items-center hover:text-brand-600">
                <i class="fa-solid fa-download text-lg"></i>
                <span>Exportar</span>
            </button>
        </nav>
    </div>

    <!-- MODAL: NUEVO / EDITAR INMUEBLE -->
    <div id="modal-inmueble" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl animate-in fade-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="modal-titulo" class="font-bold text-lg text-slate-800">Registrar Inmueble</h3>
                <button onclick="cerrarModal()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="form-inmueble" onsubmit="guardarInmueble(event)" class="space-y-4 text-sm">
                <input type="hidden" id="inmueble-id">

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Nombre / Identificador del Inmueble *</label>
                    <input type="text" id="nombre" required placeholder="Ej: Depto 2B - Centro" class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Estado</label>
                        <select id="estado" class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                            <option value="disponible">Disponible</option>
                            <option value="ocupado">Ocupado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Alquiler Mensual (Gs.) *</label>
                        <input type="number" id="monto_alquiler" required min="0" placeholder="1500000" class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Seña Inicial (Gs.)</label>
                        <input type="number" id="sena" min="0" value="0" placeholder="0" class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                        <span class="text-[10px] text-slate-400">Si no hay, dejar en 0</span>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Comisión (Gs.)</label>
                        <input type="number" id="comision" min="0" value="0" placeholder="0" class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                        <span class="text-[10px] text-slate-400">Si no hay, dejar en 0</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Inquilino (Opcional)</label>
                        <input type="text" id="inquilino" placeholder="Nombre y Apellido" class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-700 mb-1">Fecha de Cobro / Inicio</label>
                        <input type="date" id="fecha_cobro" class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Enlace Ubicación GPS / Google Maps</label>
                    <input type="url" id="gps_url" placeholder="https://maps.google.com/..." class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Observaciones / Inventario del Inmueble</label>
                    <textarea id="observaciones" rows="2" placeholder="Ej: 2 aires acondicionados, cocina empotrada, buen estado..." class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">URL de Foto del Inmueble</label>
                    <input type="url" id="foto_url" placeholder="https://images.unsplash.com/..." class="w-full border rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                    <span class="text-[10px] text-slate-400">Pega un enlace de imagen directa.</span>
                </div>

                <div class="pt-3 flex gap-3">
                    <button type="button" onclick="cerrarModal()" class="flex-1 bg-slate-100 text-slate-700 font-semibold py-3 rounded-xl hover:bg-slate-200 transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-brand-600 text-white font-semibold py-3 rounded-xl hover:bg-brand-700 shadow-lg shadow-brand-500/30 transition">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE LOGICA Y BLINDAJE (Punto Prisma Architecture) -->
    <script>
        // Clave LocalStorage
        const STORAGE_KEY = 'punto_prisma_alquileres_v1';
        let filtroActual = 'todos';

        // Datos Mock de Prueba (Blindados a prueba de errores)
        const datosEjemplo = [
            {
                id: '1',
                nombre: 'Departamento 1A - Edificio Los Jazmines',
                estado: 'ocupado',
                monto_alquiler: 1800000,
                sena: 500000,
                comision: 900000,
                inquilino: 'Carlos Benítez',
                fecha_cobro: '2026-08-13', // Forzado para activar aviso de mes vencido/cobro
                gps_url: 'https://maps.google.com/?q=-25.2637,-57.5759',
                observaciones: 'Incluye expensas básicas. 1 habitación, amoblado con aire split y placard.',
                foto_url: 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=500'
            },
            {
                id: '2',
                nombre: 'Local Comercial Nº 3 - Galerías Sur',
                estado: 'disponible',
                monto_alquiler: 2500000,
                sena: 0,
                comision: 0,
                inquilino: '',
                fecha_cobro: '',
                gps_url: 'https://maps.google.com/?q=-25.2867,-57.6470',
                observaciones: 'Amplio salón comercial con baño privado y cortina metálica automática.',
                foto_url: 'https://images.unsplash.com/photo-1497366216548-37526070297c?w=500'
            }
        ];

        // Inicializador LocalStorage
        function obtenerInmuebles() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (!data) {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(datosEjemplo));
                    return datosEjemplo;
                }
                return JSON.parse(data);
            } catch (e) {
                console.error("Error al leer localStorage:", e);
                return datosEjemplo;
            }
        }

        function guardarBD(inmuebles) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(inmuebles));
            } catch (e) {
                alert("Error al guardar localmente en el celular.");
            }
        }

        // Formato Moneda Guaraníes (Gs.)
        function formatoGs(valor) {
            const numero = Number(valor) || 0;
            return numero.toLocaleString('es-PY') + ' Gs.';
        }

        // Renderizado Principal
        function renderizar() {
            const inmuebles = obtenerInmuebles();
            const contenedor = document.getElementById('lista-inmuebles');
            contenedor.innerHTML = '';

            const filtrados = inmuebles.filter(item => {
                if (filtroActual === 'todos') return true;
                return item.estado === filtroActual;
            });

            if (filtrados.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
                        <p class="text-sm">No hay registros en esta categoría.</p>
                    </div>
                `;
                return;
            }

            filtrados.forEach(item => {
                // Cálculo de Alerta de Mes de Cobro
                let alertaCobro = false;
                if (item.estado === 'ocupado' && item.fecha_cobro) {
                    const fechaCobro = new Date(item.fecha_cobro);
                    const hoy = new Date();
                    // Verificar si ya pasó un mes o más desde el último cobro/inicio
                    const diferenciaMeses = (hoy.getFullYear() - fechaCobro.getFullYear()) * 12 + (hoy.getMonth() - fechaCobro.getMonth());
                    if (diferenciaMeses >= 1 || hoy >= fechaCobro) {
                        alertaCobro = true;
                    }
                }

                // Generar link WhatsApp para interesados (Si está disponible o para enviar detalles)
                const textoWap = encodeURIComponent(`¡Hola! Estoy interesado/a en el alquiler: *${item.nombre}*. Precio: ${formatoGs(item.monto_alquiler)}. Ubicación GPS: ${item.gps_url || 'Consultar'}`);
                const linkWap = `https://api.whatsapp.com/send?text=${textoWap}`;

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl border ${item.estado === 'ocupado' ? 'border-emerald-200 shadow-sm' : 'border-slate-200'} overflow-hidden transition`;
                
                card.innerHTML = `
                    <div class="relative h-36 bg-slate-200">
                        <img src="${item.foto_url || 'https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=500'}" alt="Foto" class="w-full h-full object-cover">
                        <div class="absolute top-2 right-2">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider shadow ${item.estado === 'ocupado' ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white'}">
                                ${item.estado}
                            </span>
                        </div>
                        ${alertaCobro ? `
                        <div class="absolute top-2 left-2 bg-rose-600 text-white px-2.5 py-1 rounded-full text-[10px] font-bold animate-pulse shadow">
                            <i class="fa-solid fa-bell mr-1"></i> ¡Mes de Cobro!
                        </div>` : ''}
                    </div>

                    <div class="p-4 space-y-2">
                        <h3 class="font-bold text-slate-800 text-base leading-tight">${item.nombre}</h3>
                        
                        <div class="bg-slate-50 p-2.5 rounded-xl space-y-1 text-xs">
                            <div class="flex justify-between font-bold text-brand-700 text-sm">
                                <span>Alquiler Mensual:</span>
                                <span>${formatoGs(item.monto_alquiler)}</span>
                            </div>
                            ${Number(item.sena) > 0 ? `<div class="flex justify-between text-slate-600"><span>Seña Inicial:</span><span>${formatoGs(item.sena)}</span></div>` : ''}
                            ${Number(item.comision) > 0 ? `<div class="flex justify-between text-slate-600"><span>Comisión:</span><span>${formatoGs(item.comision)}</span></div>` : ''}
                        </div>

                        ${item.estado === 'ocupado' ? `
                            <div class="text-xs text-slate-600 space-y-0.5 pt-1">
                                <p><strong class="text-slate-700">Inquilino:</strong> ${item.inquilino || 'No especificado'}</p>
                                <p><strong class="text-slate-700">Inicio/Cobro:</strong> ${item.fecha_cobro || 'No registrada'}</p>
                            </div>
                        ` : ''}

                        ${item.observaciones ? `
                            <p class="text-xs text-slate-500 italic bg-amber-50/50 p-2 rounded-lg border border-amber-100">
                                <strong class="not-italic font-semibold text-slate-700">Obs:</strong> ${item.observaciones}
                            </p>
                        ` : ''}

                        <div class="pt-2 flex flex-wrap gap-2 items-center justify-between border-t border-slate-100">
                            <div class="flex gap-1">
                                ${item.gps_url ? `<a href="${item.gps_url}" target="_blank" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl text-xs" title="Ver GPS"><i class="fa-solid fa-location-dot"></i></a>` : ''}
                                <a href="${linkWap}" target="_blank" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1" title="Enviar por WhatsApp"><i class="fa-brands fa-whatsapp text-sm"></i> Compartir</a>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="editarInmueble('${item.id}')" class="text-slate-400 hover:text-brand-600 p-2" title="Editar"><i class="fa-solid fa-pen-to-square"></i></button>
                                ${item.estado === 'ocupado' ? `
                                    <button onclick="darDeBaja('${item.id}')" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-2.5 py-1.5 rounded-xl text-xs font-semibold transition" title="Liberar inmueble">Dar de Baja</button>
                                ` : ''}
                                <button onclick="eliminarInmueble('${item.id}')" class="text-slate-400 hover:text-rose-600 p-2" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        // Filtros de Estado
        function filtrarEstado(estado) {
            filtroActual = estado;
            ['todos', 'ocupado', 'disponible'].forEach(est => {
                const btn = document.getElementById(`btn-filtro-${est}`);
                if (est === estado) {
                    btn.className = "flex-1 py-1.5 rounded-lg bg-brand-600 text-white transition shadow-sm font-semibold";
                } else {
                    btn.className = "flex-1 py-1.5 rounded-lg bg-white text-slate-600 border border-slate-200 transition";
                }
            });
            renderizar();
        }

        // Gestión de Modales
        function abrirModalNuevo() {
            document.getElementById('modal-titulo').innerText = 'Registrar Nuevo Inmueble';
            document.getElementById('form-inmueble').reset();
            document.getElementById('inmueble-id').value = '';
            document.getElementById('sena').value = '0';
            document.getElementById('comision').value = '0';
            document.getElementById('modal-inmueble').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-inmueble').classList.add('hidden');
        }

        function editarInmueble(id) {
            const inmuebles = obtenerInmuebles();
            const item = inmuebles.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-titulo').innerText = 'Editar Inmueble';
            document.getElementById('inmueble-id').value = item.id;
            document.getElementById('nombre').value = item.nombre;
            document.getElementById('estado').value = item.estado;
            document.getElementById('monto_alquiler').value = item.monto_alquiler;
            document.getElementById('sena').value = item.sena || 0;
            document.getElementById('comision').value = item.comision || 0;
            document.getElementById('inquilino').value = item.inquilino || '';
            document.getElementById('fecha_cobro').value = item.fecha_cobro || '';
            document.getElementById('gps_url').value = item.gps_url || '';
            document.getElementById('observaciones').value = item.observaciones || '';
            document.getElementById('foto_url').value = item.foto_url || '';

            document.getElementById('modal-inmueble').classList.remove('hidden');
        }

        // Guardar Inmueble (Crear o Actualizar)
        function guardarInmueble(e) {
            e.preventDefault();
            const id = document.getElementById('inmueble-id').value;
            const inmuebles = obtenerInmuebles();

            const nuevoItem = {
                id: id || Date.now().toString(),
                nombre: document.getElementById('nombre').value.trim(),
                estado: document.getElementById('estado').value,
                monto_alquiler: Number(document.getElementById('monto_alquiler').value) || 0,
                sena: Number(document.getElementById('sena').value) || 0,
                comision: Number(document.getElementById('comision').value) || 0,
                inquilino: document.getElementById('inquilino').value.trim(),
                fecha_cobro: document.getElementById('fecha_cobro').value,
                gps_url: document.getElementById('gps_url').value.trim(),
                observaciones: document.getElementById('observaciones').value.trim(),
                foto_url: document.getElementById('foto_url').value.trim()
            };

            if (id) {
                const index = inmuebles.findIndex(i => i.id === id);
                if (index !== -1) inmuebles[index] = nuevoItem;
            } else {
                inmuebles.unshift(nuevoItem);
            }

            guardarBD(inmuebles);
            cerrarModal();
            renderizar();
        }

        // Dar de baja (Libera el inmueble para alquilar nuevamente)
        function darDeBaja(id) {
            if (!confirm('¿Desea dar de baja este contrato? El inmueble quedará libre y disponible nuevamente.')) return;
            const inmuebles = obtenerInmuebles();
            const item = inmuebles.find(i => i.id === id);
            if (item) {
                item.estado = 'disponible';
                item.inquilino = '';
                item.fecha_cobro = '';
                item.sena = 0;
                item.comision = 0;
                guardarBD(inmuebles);
                renderizar();
            }
        }

        // Eliminar Registro
        function eliminarInmueble(id) {
            if (!confirm('¿Está seguro de eliminar permanentemente este registro?')) return;
            let inmuebles = obtenerInmuebles();
            inmuebles = inmuebles.filter(i => i.id !== id);
            guardarBD(inmuebles);
            renderizar();
        }

        // Exportar Backup de Seguridad Local
        function exportarBackup() {
            const data = localStorage.getItem(STORAGE_KEY);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_alquileres_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        // Inicializar al cargar la página
        window.onload = renderizar;
    </script>
</body>
</html>
